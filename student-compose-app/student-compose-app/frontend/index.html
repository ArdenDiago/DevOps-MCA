<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Docker Compose Demo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 48px 56px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            margin: 0 0 20px;
            font-size: 2.2rem;
        }
        button {
            background: #2496ED;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #1c7bc4;
        }
        #message {
            margin-top: 18px;
            font-size: 1.1rem;
            color: #7fd1ff;
            min-height: 1.3em;
        }
        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #90a4ae;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎓 Student Greeting App</h1>
        <button onclick="getMessage()">Get Backend Message</button>
        <p id="message"></p>
        <p class="footer">Arnav Narula &middot; 2547115</p>
    </div>

    <script>
        async function getMessage() {
            const response = await fetch("http://localhost:5000");
            const data = await response.json();

            document.getElementById("message").innerText = data.message;
        }
    </script>

</body>
</html>
