name: Lab2-Action

on:
  push:
    branches: [main]
    paths:
      - 'Labs/Lab2/**'

  workflow_dispatch:


# Required permissions for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  # ==========================================
  # 1. TEST BACKEND
  # ==========================================
  test-backend:
    name: Test the backend system
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Labs/Lab2/backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Labs/Lab2/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test


  # ==========================================
  # 2. BUILD FRONTEND
  # ==========================================
  build-frontend:
    name: Build the frontend
    needs: test-backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Labs/Lab2/frontend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Labs/Lab2/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Commit and Push to docs folder
        run: |
          # Go back to the root of the repository
          cd ../../../
          
          # Clean old docs and copy the new build
          rm -rf docs/*
          mkdir -p docs
          cp -r Labs/Lab2/frontend/dist/* docs/
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add, commit, and push
          git add docs/
          git commit -m "chore: deploy Lab2 build to docs folder [skip ci]" || echo "No changes to commit"
          git push


  # ==========================================
  # 4. SUCCESS MESSAGE
  # ==========================================
  done-message:
    name: Success
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:

      - name: Echo Success Message
        run: |
          echo "Hello user ${{ github.actor }}"
          echo "Your Lab2 tests and build completed successfully."
          echo "Your Lab2 has been built and saved to the docs folder."


  # ==========================================
  # 5. FAILURE HANDLER
  # ==========================================
  handle-pipeline-failure:
    name: Handle Pipeline Failure
    needs:
      - test-backend
      - build-frontend

    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:

      - name: Report Failure
        run: |
          echo "Pipeline has failed."
          echo "Please check the failed job above."

