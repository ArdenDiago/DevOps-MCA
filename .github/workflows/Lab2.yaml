name: Lab2-Action

on:
  push:
    branches: [main]
    paths:
      - 'Labs/Lab2/**'

  workflow_dispatch:


# Required permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  # ==========================================
  # 1. TEST BACKEND
  # ==========================================
  test-backend:
    name: Test the backend system
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Labs/Lab2/backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Labs/Lab2/backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test


  # ==========================================
  # 2. BUILD FRONTEND
  # ==========================================
  build-frontend:
    name: Build the frontend
    needs: test-backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Labs/Lab2/frontend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Labs/Lab2/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      # Create the directory structure that will be deployed
      - name: Prepare GitHub Pages
        run: |
          mkdir -p ../../pages/Labs/Lab2
          cp -r dist/* ../../pages/Labs/Lab2/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/


  # ==========================================
  # 3. DEPLOY TO GITHUB PAGES
  # ==========================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build-frontend
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ==========================================
  # 4. SUCCESS MESSAGE
  # ==========================================
  done-message:
    name: Success
    needs: deploy
    runs-on: ubuntu-latest

    steps:

      - name: Echo Success Message
        run: |
          echo "Hello user ${{ github.actor }}"
          echo "Your Lab2 tests and build completed successfully."
          echo "Your Lab2 has been deployed to GitHub Pages."


  # ==========================================
  # 5. FAILURE HANDLER
  # ==========================================
  handle-pipeline-failure:
    name: Handle Pipeline Failure
    needs:
      - test-backend
      - build-frontend
      - deploy

    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:

      - name: Report Failure
        run: |
          echo "Pipeline has failed."
          echo "Please check the failed job above."

