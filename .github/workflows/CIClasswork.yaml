name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'ClassWork/CICD/**'
      - '.github/workflows/CIClasswork.yaml'
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ClassWork/CICD

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Run tests
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ClassWork/CICD
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cicd:latest
            ${{ vars.DOCKERHUB_USERNAME }}/cicd:${{ github.sha }}
