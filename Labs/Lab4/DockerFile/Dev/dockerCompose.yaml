
services:
  mongodb:
    image: mongo:latest 
    container_name: MongoDB 
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - ./Volume/mongodb:/data/db

  redisdb:
    image: redis:latest 
    container_name: RedisDB 
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${Redis_Password}"]
    volumes:
      - ./Volume/redis:/data

  backend:
    depends_on:
      - mongodb
      - redisdb
    build:
      context: ../..
      dockerfile: DockerFile/Dev/Images/backend.Dockerfile
    container_name: backend
    ports:
      - '3000:3000'
    volumes:
      - ../../backend/:/app
      - /app/node_modules
    env_file:
      - .env


  frontend:
    depends_on:
      - backend
    build:
      context: ../..
      dockerfile: DockerFile/Dev/Images/frontend.Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend/:/app
      - /app/node_modules


